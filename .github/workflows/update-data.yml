name: Update data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lấy dữ liệu FaucetPay
        run: python3 tools/fetch_faucetpay.py
      - name: Commit nếu có thay đổi
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet || (git commit -m "Cập nhật dữ liệu FaucetPay" && git push)
